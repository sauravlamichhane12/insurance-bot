<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>MediLink Insurance Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      --sky-50: #f0f9ff;
      --sky-100: #e0f2fe;
      --sky-300: #7dd3fc;
      --sky-500: #0ea5e9;
      --sky-600: #0284c7;
      --sky-700: #0369a1;
      --panel: rgba(255, 255, 255, 0.96);
      --panel-border: rgba(2, 132, 199, 0.12);
      --text-main: #082f49;
      --text-soft: #4b6b80;
      --danger-fg: #9f1239;
      --danger-bg: #fff1f2;
      --danger-bd: #fecdd3;
      --focus-ring: 0 0 0 3px rgba(14, 165, 233, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Manrope', sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(900px 500px at 100% -10%, rgba(14, 165, 233, 0.14), transparent 55%),
        radial-gradient(1000px 650px at -10% 100%, rgba(125, 211, 252, 0.16), transparent 60%),
        linear-gradient(180deg, #f8fdff, #eef8fd 55%, #e0f2fe);
      position: relative;
    }

    .login-container {
      width: 100%;
      max-width: 580px;
      padding: 32px 16px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      padding: 36px 40px 36px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .logo-placeholder {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0 auto 8px;
      border: 1px solid rgba(2, 132, 199, 0.12);
      position: relative;
      z-index: 1;
    }

    .login-logo {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }

    .login-copy {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
    }

    .login-title {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--sky-700);
      letter-spacing: -0.03em;
    }

    .login-subtitle {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-soft);
      max-width: 430px;
      margin: 0 auto;
    }

    .login-error {
      display: none;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--danger-fg);
      background: var(--danger-bg);
      border: 1px solid var(--danger-bd);
      border-radius: 14px;
      padding: 12px 16px;
      text-align: left;
      position: relative;
      z-index: 1;
    }

    form {
      display: grid;
      gap: 14px;
      text-align: left;
      position: relative;
      z-index: 1;
      padding: 20px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(248, 250, 252, 0.88));
      border: 1px solid rgba(2, 132, 199, 0.08);
    }

    label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-soft);
    }

    input {
      width: 100%;
      border: 1px solid rgba(2, 132, 199, 0.16);
      border-radius: 16px;
      padding: 14px 16px;
      font: inherit;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.98);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    input:focus {
      border-color: var(--sky-500);
      box-shadow: var(--focus-ring);
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .password-field {
      position: relative;
    }

    .password-input {
      padding-right: 80px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--sky-600);
      cursor: pointer;
      padding: 6px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .password-toggle .icon-eye-off {
      display: none;
    }

    .password-toggle.is-visible .icon-eye {
      display: none;
    }

    .password-toggle.is-visible .icon-eye-off {
      display: block;
    }

    .login-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #0f7bb8, #18a1e0 58%, #44c7f4);
      color: #fff;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .login-button:hover {
      transform: translateY(-1px);
    }

    .login-button:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .login-footnote {
      color: var(--text-soft);
      font-size: 0.88rem;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    .login-footnote a {
      color: var(--sky-600);
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .login-card {
        padding: 40px 24px 28px;
      }

      .logo-placeholder {
        width: 84px;
        height: 84px;
        margin-top: 0;
      }

      .login-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-placeholder">
        <img src="/medilink_logo.svg" alt="MediLink Insurance Logo" class="login-logo">
      </div>
      <div class="login-copy">
        <div class="login-title">Welcome to Medilink</div>
        <div class="login-subtitle">
          Sign in to access your account.
        </div>
      </div>

      <div id="error-box" class="login-error"></div>

      <form method="POST" action="/login">
        <input type="hidden" name="next" value="/chat" />
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" class="password-input" name="password" type="password" autocomplete="current-password" required />
            <button id="password-toggle" class="password-toggle" type="button" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.7a3 3 0 0 0 4.2 4.2"></path>
                <path d="M9.9 5.2A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7a17.3 17.3 0 0 1-4 4.9"></path>
                <path d="M6.6 6.7A17.7 17.7 0 0 0 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.5"></path>
              </svg>
            </button>
          </div>
        </div>
        <button class="login-button" type="submit">Login</button>
      </form>

      <div class="login-footnote">
        Need admin access? <a href="/admin/login">Admin sign-in</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const errorBox = document.getElementById('error-box');
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');
    const messages = {
      invalid: 'The username or password is incorrect.',
      inactive: 'Your account is inactive. Contact an administrator.',
      admin: 'Your account does not currently have administrator access.'
    };

    const error = params.get('error');
    if (error && errorBox) {
      errorBox.textContent = messages[error] || 'Sign-in failed. Please try again.';
      errorBox.style.display = 'block';
    }

    if (passwordInput && passwordToggle) {
      passwordToggle.addEventListener('click', () => {
        const isVisible = passwordInput.type === 'text';
        passwordInput.type = isVisible ? 'password' : 'text';
        passwordToggle.classList.toggle('is-visible', !isVisible);
        passwordToggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
      });
    }
  </script>
</body>

</html>

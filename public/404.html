<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Page not found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #003366;
      color: #bbbbbb;
    }

    .notfound-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 32px 40px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
      max-width: 420px;
      text-align: center;
    }

    .notfound-title {
      font-size: 1.6rem;
      margin-bottom: 6px;
      color: #4a4f55;
    }

    .notfound-text {
      font-size: 0.9rem;
      color: #7F8287;
      margin-bottom: 18px;
    }

    .notfound-link {
      display: inline-block;
      padding: 10px 18px;
      background: #005B99;
      color: #E8F5FB;
      text-decoration: none;
      border-radius: 999px;
      font-size: 0.9rem;
      box-shadow: 0 8px 18px rgba(0, 91, 153, 0.5);
    }

    .notfound-link:hover {
      background: #004A7D;
    }
  </style>
</head>

<body>
  <div class="notfound-card">
    <div class="notfound-title">Page not found</div>
    <div class="notfound-text">
      The page you are looking for does not exist or has moved.<br />
      Return to the assistant to continue.
    </div>
    <a href="/login" class="notfound-link">Go to login</a>
  </div>
</body>

</html>

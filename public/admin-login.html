<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>MediLink Admin Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      --sky-100: #e0f2fe;
      --sky-300: #7dd3fc;
      --sky-500: #0ea5e9;
      --sky-600: #0284c7;
      --sky-900: #082f49;
      --panel: rgba(255, 255, 255, 0.97);
      --panel-border: rgba(14, 165, 233, 0.14);
      --text-main: #082f49;
      --text-soft: #4b6b80;
      --danger-fg: #9f1239;
      --danger-bg: #fff1f2;
      --danger-bd: #fecdd3;
      --shadow-xl: 0 34px 64px rgba(8, 47, 73, 0.28);
      --shadow-md: 0 14px 26px rgba(8, 47, 73, 0.14);
      --focus-ring: 0 0 0 3px rgba(14, 165, 233, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Manrope', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      background:
        radial-gradient(circle at top right, rgba(125, 211, 252, 0.28) 0%, transparent 30%),
        linear-gradient(135deg, #082f49, #0c4a6e, #0284c7);
    }

    .card {
      width: 100%;
      max-width: 520px;
      margin: 16px;
      padding: 48px 40px 36px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow-xl);
      display: flex;
      flex-direction: column;
      gap: 22px;
      text-align: center;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: -80px auto 8px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid rgba(14, 165, 233, 0.14);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo img { width: 82%; height: 82%; object-fit: contain; }
    .title { font-size: 1.75rem; font-weight: 800; color: var(--sky-900); }
    .subtitle { font-size: 1rem; color: var(--text-soft); line-height: 1.6; max-width: 400px; margin: 0 auto; }

    .error {
      display: none;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--danger-bd);
      background: var(--danger-bg);
      color: var(--danger-fg);
      font-size: 0.88rem;
      font-weight: 600;
      text-align: left;
    }

    .panel {
      text-align: left;
      background: #f0f9ff;
      border: 1px solid rgba(14, 165, 233, 0.12);
      border-radius: 18px;
      padding: 18px;
      display: grid;
      gap: 10px;
    }

    .panel strong { color: var(--sky-900); font-size: 1rem; font-weight: 800; }
    .panel p { color: var(--text-soft); font-size: 0.92rem; line-height: 1.55; }
    form { display: grid; gap: 14px; text-align: left; }
    label { font-size: 0.84rem; font-weight: 700; color: var(--text-soft); }
    .field { display: grid; gap: 7px; }

    input {
      width: 100%;
      border: 1px solid rgba(2, 132, 199, 0.16);
      border-radius: 16px;
      padding: 14px 16px;
      font: inherit;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.98);
      outline: none;
    }

    input:focus { border-color: var(--sky-500); box-shadow: var(--focus-ring); }

    .btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--sky-500), var(--sky-600));
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(2, 132, 199, 0.22);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">
      <img src="/medilink_logo.svg" alt="MediLink Insurance Logo">
    </div>

    <div class="title">MediLink Admin Portal</div>
    <div class="subtitle">Sign in with your local administrator credentials to manage users and ingest insurance documents.</div>

    <div id="error-box" class="error"></div>

    <div class="panel">
      <strong>Administrator Access</strong>
      <p>Your account must have the <code>admin</code> role assigned in the application before the dashboard will open.</p>
    </div>

    <form method="POST" action="/admin/login">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn" type="submit">Sign In to Admin</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const errorBox = document.getElementById('error-box');
    const messages = {
      invalid: 'The username or password is incorrect.',
      inactive: 'Your account is inactive. Contact an administrator.',
      admin: 'Your account is signed in, but it does not have administrator access.'
    };

    const error = params.get('error');
    if (error && errorBox) {
      errorBox.textContent = messages[error] || 'Sign-in failed. Please try again.';
      errorBox.style.display = 'block';
    }
  </script>
</body>

</html>

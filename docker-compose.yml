services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medilink-app

    ports:
      - "${PORT:-8001}:${PORT:-8001}"

    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1

    volumes:
      - app_data:/app/data
      - app_uploads:/app/uploads

    restart: unless-stopped

volumes:
  app_data:
  app_uploads:
